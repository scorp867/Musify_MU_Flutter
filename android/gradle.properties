org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
android.builtInKotlin=false
android.newDsl=false

org.gradle.tooling.parallel=true
org.gradle.parallel=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.caching=true
org.gradle.configuration-cache=false
android.hardware.type=low_latency
android.enableNativeLibraryOptimization=true
android.enableR8.fullMode=true
android.nonFinalResIds=true
android.enablePngCrunchOptimization=true
android.experimental.enableArtProfiles=true
android.experimental.r8.dex-startup-optimization=true
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
kotlin.jvm.target.validation.mode=warning
android.uniquePackageNames=false
