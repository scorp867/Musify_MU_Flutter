    EXTRACTED_COLOR = 23;
    PLAY_TRAIT = 57;
    NAVIGABLE_TRAIT = 62;
    PLAYABILITY = 78;
    COVER_IMAGE = 79;
    SHARE_TRAIT = 80;
    SIMPLE_TRAIT = 97;
    AUDIO_PREVIEW_PLAYBACK_TRAIT = 116;
    PREVIEW_CARD_TRAIT = 118;
    SHORTCUTS_CARD_TRAIT = 119;
    VIDEO_PREVIEW_PLAYBACK_TRAIT = 120;
    IDENTITY_TRAIT = 178;
